name: Sync CTAN tlnet

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write  # needed for gh cache delete
      contents: write # needed for creating releases and pushing _redirects

    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      STAGING_DIR: $HOME/tlnet

    steps:
      - name: Checkout repo
        uses: actions/checkout@HEAD

      - name: Install rclone and cmark
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y cmark
          mkdir -p ~/.config/rclone
          touch ~/.config/rclone/rclone.conf
          rclone version
          rsync --version

      - name: Create staging directory
        run: mkdir -p "$STAGING_DIR"

      - name: Restore tlnet cache
        id: cache-restore
        uses: actions/cache/restore@HEAD
        with:
          path: ${{ env.STAGING_DIR }}
          key: tlnet-${{ runner.os }}

      - name: Report cache status
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit — rsync will only transfer the delta."
            du -sh "$STAGING_DIR" || true
          else
            echo "Cache miss — rsync will do a full download."
          fi

      - name: Rsync CTAN tlnet to local staging (with checksum verification)
        run: |
          max_attempts=20
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt of $max_attempts: running rsync..."
            bash rsync_ctan.sh "$STAGING_DIR"
            if bash verify_checksums.sh "$STAGING_DIR"; then
              echo "Checksums verified successfully on attempt $attempt."
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Checksum verification failed. Waiting 5 minutes before retrying..."
              sleep 300
            else
              echo "FATAL: Checksum verification failed after $max_attempts attempts. Aborting."
              exit 1
            fi
          done

      - name: Report staging size
        run: |
          du -sh "$STAGING_DIR"
          find "$STAGING_DIR" -type f -size +20M -exec du -h {} +

      # actions/cache has no built-in overwrite support — if the key already
      # exists, cache/save silently skips saving. To force an update we must
      # first delete the existing entry, then save under the same key.
      # The '|| true' on delete is intentional: the first-ever run has no
      # cache entry to delete, and we don't want that to fail the workflow.
      - name: Delete old cache entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete tlnet-${{ runner.os }} \
            --repo ${{ github.repository }} || true

      - name: Save tlnet cache
        uses: actions/cache/save@HEAD
        with:
          path: ${{ env.STAGING_DIR }}
          key: tlnet-${{ runner.os }}

      # Replace each symlink foo.tar.xz -> foo.r12345.tar.xz with a real
      # copy of the target, then delete the versioned file. After this step,
      # staging contains only unversioned filenames as real files.
      - name: Resolve symlinks in staging
        run: python3 resolve_symlinks.py "$STAGING_DIR"

      - name: Parse rsync changes
        id: parse-changes
        run: |
          # >f = new/updated regular file; >L = new/updated symlink; cL = changed symlink
          # After symlink resolution both map to real files in staging.
          # Only include paths that actually exist in staging now.
          grep '^>[fL]\|^cL' /tmp/rsync-changes.txt \
            | awk '{print $2}' \
            | while IFS= read -r f; do
                [ -e "$STAGING_DIR/$f" ] && echo "$f"
              done > /tmp/to-upload.txt || true
          if [ -s /tmp/to-upload.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected: $(wc -l < /tmp/to-upload.txt) files"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — subsequent steps will be skipped."
          fi

      - name: Build directory index pages
        if: steps.parse-changes.outputs.has_changes == 'true'
        run: |
          python3 build_indexes.py \
            "$STAGING_DIR" \
            /tmp/to-upload.txt \
            index_template.html \
            README.md

      - name: Check for unexpected platforms in archive
        if: steps.parse-changes.outputs.has_changes == 'true'
        run: python3 check_platforms.py "$STAGING_DIR"

      - name: Upload changed files to R2
        if: steps.parse-changes.outputs.has_changes == 'true'
        run: |
          if [ ! -s /tmp/to-upload.txt ]; then
            echo "Nothing to upload."
            exit 0
          fi
          rclone copy \
            "$STAGING_DIR/" \
            r2:${{ secrets.R2_BUCKET_NAME }} \
            --files-from /tmp/to-upload.txt \
            --no-traverse \
            --transfers 8 \
            --stats 60s \
            --stats-one-line \
            --use-mmap \
            --retries 5 \
            --low-level-retries 10 \
            --retries-sleep 30s \
            --log-level INFO

      - name: Final sync to R2 (size-only, safety net)
        if: steps.parse-changes.outputs.has_changes == 'true'
        run: |
          rclone sync \
            "$STAGING_DIR/" \
            r2:${{ secrets.R2_BUCKET_NAME }} \
            --size-only \
            --transfers 8 \
            --checkers 16 \
            --stats 60s \
            --stats-one-line \
            --use-mmap \
            --retries 5 \
            --low-level-retries 10 \
            --retries-sleep 30s \
            --log-level INFO

      - name: Create GitHub release
        if: steps.parse-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(date +%Y.%m.%d.%H.%M)
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated daily sync of CTAN tlnet"

      - name: Upload large files (>24 MB) to GitHub release
        if: steps.parse-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch /tmp/large-files.txt
          find "$STAGING_DIR" -type f -size +24M | sort | while IFS= read -r filepath; do
            relpath="${filepath#$STAGING_DIR/}"
            # Replace every / with = to encode the path in a flat filename
            assetname="${relpath//\//=}"
            echo "Uploading $relpath as $assetname ..."
            for attempt in $(seq 1 5); do
              if gh release upload "$RELEASE_TAG" "$filepath" \
                   --name "$assetname" \
                   --repo "$GITHUB_REPOSITORY" \
                   --clobber; then
                echo "$relpath" >> /tmp/large-files.txt
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Attempt $attempt failed, retrying in 30s..."
                sleep 30
              else
                echo "ERROR: failed to upload $relpath after 5 attempts"
                exit 1
              fi
            done
          done

      - name: Remove large files, compress remainder, upload archive
        if: steps.parse-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the large files we just uploaded from the staging tree
          if [ -s /tmp/large-files.txt ]; then
            while IFS= read -r relpath; do
              rm -f "$STAGING_DIR/$relpath"
            done < /tmp/large-files.txt
          fi

          # Ensure zstd is available
          command -v zstd &>/dev/null || sudo apt-get install -y zstd -qq

          # Compress everything that remains (should be well under 2 GB)
          echo "Compressing $STAGING_DIR ..."
          tar -C "$STAGING_DIR" --zstd -cf /tmp/tlnet.tar.zst .
          du -sh /tmp/tlnet.tar.zst

          # Upload the archive with retry
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" /tmp/tlnet.tar.zst \
                 --repo "$GITHUB_REPOSITORY" \
                 --clobber; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt failed, retrying in 30s..."
              sleep 30
            else
              echo "ERROR: failed to upload archive after 5 attempts"
              exit 1
            fi
          done

      - name: Generate _redirects and push to repo
        if: steps.parse-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build a Cloudflare Pages _redirects file for every large file.
          # Each line: /rel/path  https://github.com/REPO/releases/download/TAG/rel=path  302
          > _redirects
          if [ -s /tmp/large-files.txt ]; then
            while IFS= read -r relpath; do
              assetname="${relpath//\//=}"
              echo "/$relpath  https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$assetname  302" \
                >> _redirects
            done < /tmp/large-files.txt
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add _redirects
          if git diff --staged --quiet; then
            echo "No changes to _redirects — nothing to commit."
          else
            git commit -m "Update _redirects for release $RELEASE_TAG [skip ci]"
            # Retry push in case of transient remote conflicts
            for attempt in $(seq 1 3); do
              if git pull --rebase && git push; then
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 10
            done
          fi

      - name: Delete old GitHub releases (keep 2 most recent)
        if: steps.parse-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
          | while IFS= read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --yes \
                --cleanup-tag || true
            done

      - name: Print bucket summary
        if: always()
        run: |
          echo "Sync completed at $(date -u)"
          rclone size r2:${{ secrets.R2_BUCKET_NAME }} --json 2>/dev/null \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          gb = d['bytes'] / 1024**3
          print(f'Bucket: {gb:.2f} GB, {d[\"count\"]} files')
          " || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash create_release.sh
